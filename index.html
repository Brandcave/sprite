<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- The hero's own head, cut from his walk sprite — see scripts/favicon.mjs -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Chasing Amy</title>

    <!--
      Link preview. The card is generated by scripts/og.mjs out of the same
      bitmaps the game draws with. og:image wants an absolute URL and there is
      no permanent domain yet — the relay hands out a fresh tunnel every session
      — so this stays root-relative: Slack and iMessage resolve it against the
      page, Twitter and LinkedIn want it spelled out. Make it absolute the day
      this lands somewhere with a name.
    -->
    <meta name="description" content="A small island you can walk around, at whatever hour it happens to be." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chasing Amy" />
    <meta property="og:description" content="A small island you can walk around, at whatever hour it happens to be." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0d1426;
        overscroll-behavior: none;      /* no pull-to-refresh mid-walk */
      }
      /* dvh, so a phone's disappearing address bar does not crop the island */
      #view { display: block; width: 100vw; height: 100vh; height: 100dvh; }

      .hud {
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #eaf2ff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        user-select: none;
        pointer-events: none;
      }
      /* Sits in the corner of the minimap, which adopts it — see minimap.js. */
      #clockwrap { position: absolute; right: 8px; bottom: 5px; }
      #clock { font-size: 12px; letter-spacing: 0.1em; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div class="hud" id="clockwrap">
      <span id="clock">08:00</span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
